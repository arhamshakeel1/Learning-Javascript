<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:300"

            //requirement
            document
                .querySelector('button')
                .addEventListener('click', this.handleClick.bind(this))

        }
        handleClick(){
            console.log("button clicked");
            console.log(this.server);//if we dont use bind(), it will read it as button.server as button called the function. so it will be undefined
        }
    }

    const app = new React()
//the handleClick event listener only has the button's context (this refers to the button itself).
//Using the bind method, we can set the this
//context to a different object, allowing us to access the context where the event listener was created,
//not just the button's context.

    
</script>
</html>
